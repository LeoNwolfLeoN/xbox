<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" font-family="Segoe UI, Arial, sans-serif">
<title>Experiment 3 wiring diagram</title>
<style>
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray text{fill:#444441}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple text{fill:#3C3489}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal text{fill:#085041}
.lbl{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="770" fill="#ffffff"/>
<g class="gray"><rect x="440" y="20" width="200" height="44" rx="8" stroke-width="0.8"/><text class="th" x="540" y="47" text-anchor="middle">Xbox controller</text></g>
<line x1="540" y1="64" x2="540" y2="116" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts lbl" x="550" y="84">Bluetooth</text>
<rect x="20" y="90" width="640" height="190" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="6 4"/>
<text class="th lbl" x="36" y="115">TX</text>
<g class="purple"><rect x="60" y="120" width="150" height="140" rx="8" stroke-width="0.8"/><text class="th" x="135" y="145" text-anchor="middle">OLED SH1106</text><text class="ts" x="196" y="174" text-anchor="end">VCC</text><text class="ts" x="196" y="199" text-anchor="end">GND</text><text class="ts" x="196" y="224" text-anchor="end">SDA</text><text class="ts" x="196" y="249" text-anchor="end">SCL</text></g>
<g class="purple"><rect x="440" y="120" width="200" height="140" rx="8" stroke-width="0.8"/><text class="th" x="540" y="145" text-anchor="middle">ESP32 DevKit V1 (USB)</text><text class="ts" x="454" y="174">3V3</text><text class="ts" x="454" y="199">GND</text><text class="ts" x="454" y="224">GPIO21</text><text class="ts" x="454" y="249">GPIO22</text></g>
<line x1="210" y1="170" x2="440" y2="170" stroke="#E24B4A" stroke-width="1.5"/>
<line x1="210" y1="195" x2="440" y2="195" stroke="#888780" stroke-width="1.5"/>
<line x1="210" y1="220" x2="440" y2="220" stroke="#BA7517" stroke-width="1.5"/>
<line x1="210" y1="245" x2="440" y2="245" stroke="#BA7517" stroke-width="1.5"/>
<path d="M540 260 L540 335 L340 335 L340 346" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts lbl" x="550" y="296">Wi-Fi UDP 4210 / 4211</text>
<rect x="20" y="310" width="640" height="310" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="6 4"/>
<text class="th lbl" x="36" y="335">RX</text>
<g class="purple"><rect x="250" y="350" width="180" height="210" rx="8" stroke-width="0.8"/><text class="th" x="340" y="375" text-anchor="middle">ESP32-S3 (USB)</text><text class="ts" x="264" y="404">GPIO16</text><text class="ts" x="264" y="429">GND</text><text class="ts" x="264" y="494">GPIO17</text><text class="ts" x="264" y="519">GND</text><text class="ts" x="416" y="404" text-anchor="end">GPIO15</text><text class="ts" x="416" y="484" text-anchor="end">GND</text></g>
<g class="teal"><rect x="50" y="380" width="160" height="70" rx="8" stroke-width="0.8"/><text class="th" x="130" y="406" text-anchor="middle">MG995 (aileron)</text><text class="ts" x="130" y="432" text-anchor="middle">Red wire to 5V BEC</text></g>
<g class="teal"><rect x="50" y="470" width="160" height="70" rx="8" stroke-width="0.8"/><text class="th" x="130" y="496" text-anchor="middle">SG90 (elevator)</text><text class="ts" x="130" y="522" text-anchor="middle">Red wire to 5V BEC</text></g>
<line x1="210" y1="400" x2="250" y2="400" stroke="#BA7517" stroke-width="1.5"/>
<line x1="210" y1="425" x2="250" y2="425" stroke="#888780" stroke-width="1.5"/>
<line x1="210" y1="490" x2="250" y2="490" stroke="#BA7517" stroke-width="1.5"/>
<line x1="210" y1="515" x2="250" y2="515" stroke="#888780" stroke-width="1.5"/>
<g class="teal"><rect x="470" y="380" width="170" height="170" rx="8" stroke-width="0.8"/><text class="ts" x="484" y="404">Signal</text><text class="ts" x="484" y="484">GND</text><text class="ts" x="484" y="534">5V BEC</text><text class="th" x="595" y="445" text-anchor="middle">ESC</text><text class="ts" x="595" y="464" text-anchor="middle">30A</text></g>
<line x1="430" y1="400" x2="470" y2="400" stroke="#BA7517" stroke-width="1.5"/>
<line x1="430" y1="480" x2="470" y2="480" stroke="#888780" stroke-width="1.5"/>
<path d="M490 550 L490 585 L30 585 L30 415 L50 415" fill="none" stroke="#E24B4A" stroke-width="1.5"/>
<line x1="130" y1="585" x2="130" y2="540" stroke="#E24B4A" stroke-width="1.5"/>
<text class="ts lbl" x="260" y="606" text-anchor="middle">5V BEC to servos only</text>
<line x1="530" y1="550" x2="530" y2="650" stroke="#993C1D" stroke-width="2.5"/>
<text class="ts lbl" x="538" y="608">3 wires</text>
<line x1="610" y1="550" x2="610" y2="650" stroke="#444441" stroke-width="2.5"/>
<text class="ts lbl" x="618" y="608">12V</text>
<g class="teal"><rect x="360" y="650" width="190" height="56" rx="8" stroke-width="0.8"/><text class="th" x="455" y="673" text-anchor="middle">Brushless motor</text><text class="ts" x="455" y="693" text-anchor="middle">No propeller</text></g>
<g class="gray"><rect x="565" y="650" width="105" height="56" rx="8" stroke-width="0.8"/><text class="th" x="617" y="673" text-anchor="middle">12V 5A</text><text class="ts" x="617" y="693" text-anchor="middle">via DC jack</text></g>
<line x1="40" y1="745" x2="70" y2="745" stroke="#BA7517" stroke-width="1.5"/><text class="ts lbl" x="78" y="749">Signal</text>
<line x1="150" y1="745" x2="180" y2="745" stroke="#888780" stroke-width="1.5"/><text class="ts lbl" x="188" y="749">GND</text>
<line x1="250" y1="745" x2="280" y2="745" stroke="#E24B4A" stroke-width="1.5"/><text class="ts lbl" x="288" y="749">3.3V / 5V</text>
<line x1="380" y1="745" x2="410" y2="745" stroke="#444441" stroke-width="2.5"/><text class="ts lbl" x="418" y="749">12V / motor</text>
</svg>
